---
# go-arch-lint configuration. Enforces directional dependencies between
# top-level components. The compiler already prevents cycles and
# cross-module imports; this catches the intra-project layering rules the
# compiler doesn't (e.g., "cmd may depend on buildmeta, but not the
# reverse").
#
# Scaffold: today the only components are `cmd` and `buildmeta`. As
# `internal/` gains sub-packages worth fencing (handlers vs services,
# domain vs infrastructure, etc.), add finer-grained components and the
# `mayDependOn` rules between them here.
version: 3

# Each component names the third-party packages it may import under
# canUse, so Cobra and pflag stay in the command packages and every other
# component stays on the standard library and this module.
#
# deepScan: false disables the method-call / dependency-injection
# tracking. The basic component-imports check is the rule that's
# load-bearing at this scale; revisit when components grow interfaces
# whose implementations cross layers.
allow:
  depOnAnyVendor: false
  deepScan: false

# Exclude vendored code, test fixtures, and any out-of-band tooling
# directories from component analysis. Without this, every vendored file
# shows up as "not attached to any component" — the architecture rules
# are about *our* code, not theirs.
# Add consumer-generated and tool-installed directories to this list as well.
# Direct go-arch-lint calls cannot read .gitignore.
exclude:
  - apm_modules
  - .claude
  - .agents
  - .codex
  - vendor
  - testdata
  - tools

vendors:
  cobra:
    in: github.com/spf13/cobra
  pflag:
    in: github.com/spf13/pflag

components:
  cmd:
    in: cmd/afakt
  cmdroot:
    in: internal/cmd/root
  cmdserver:
    in: internal/cmd/server
  cmdstatus:
    in: internal/cmd/status
  cmdhelp:
    in: internal/cmd/help
  cmdutil:
    in: internal/cmdutil
  buildmeta:
    in: internal/buildmeta
  server:
    in: internal/server
  lifecycle:
    in: internal/lifecycle
  lifecycletest:
    in: internal/lifecycle/lifecycletest

deps:
  # Only main, the command packages, and cmdutil may use Cobra and pflag. cmdutil depends on
  # no command package.
  cmd:
    mayDependOn:
      - buildmeta
      - cmdroot
      - cmdutil
    canUse:
      - cobra
      - pflag
  # go-arch-lint reads test files too, so the rules below include the edges that only tests
  # use: each package's external tests import the package itself, the tests of the server
  # command run it through the root, and the tests of server and lifecycle import the fakes
  # in lifecycletest.
  cmdroot:
    mayDependOn:
      - cmdroot
      - cmdserver
      - cmdstatus
      - cmdhelp
      - cmdutil
    canUse:
      - cobra
      - pflag
  cmdhelp:
    mayDependOn:
      - cmdhelp
      - cmdutil
    canUse:
      - cobra
      - pflag
  cmdstatus:
    mayDependOn:
      - cmdstatus
      - cmdutil
    canUse:
      - cobra
      - pflag
  cmdserver:
    mayDependOn:
      - cmdserver
      - cmdroot
      - cmdutil
      - server
    canUse:
      - cobra
      - pflag
  cmdutil:
    mayDependOn:
      - cmdutil
    canUse:
      - cobra
      - pflag
  buildmeta:
    # The schema requires a reference; self-reference forbids other components.
    mayDependOn:
      - buildmeta
  server:
    mayDependOn:
      - server
      - lifecycle
      - lifecycletest
  lifecycle:
    # The lifecycle package imports only the standard library. Its non-test code can't
    # import lifecycletest, because lifecycletest imports lifecycle and Go rejects the cycle.
    mayDependOn:
      - lifecycle
      - lifecycletest
  lifecycletest:
    mayDependOn:
      - lifecycletest
      - lifecycle
