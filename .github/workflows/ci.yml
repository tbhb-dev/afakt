---
# Quality gates for afakt: lint, Go tests on Linux and macOS, coverage,
# reachable vulnerabilities, and drift in the payload and Go dependencies.
# Every job installs the pinned toolchain through mise and runs its gate
# through `mise run`, so the mise config stays the single definition of what
# each gate runs.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A lockfile only binds a version it has already seen. Without this, moving
# a pin in mise.toml and leaving mise.lock alone makes mise fetch the new
# version, compute a fresh digest, and rewrite the lockfile in place -- so a
# Renovate PR that touched only the manifest would go green while the
# committed digests drifted from the pins under review. MISE_LOCKED makes
# that a hard failure instead.
env:
  MISE_LOCKED: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # Full history: the leak scan below reads every commit a pull
      # request adds, and a shallow clone is refused as incomplete.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up the toolchain
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.15

      # mise installs the vale binary but does not fetch the style packages
      # .vale.ini declares.
      - name: Sync Vale styles
        run: mise run install-tools

      - name: Lint
        run: mise run lint

      # The tree scan in `lint` sees only the checkout. This reads every
      # commit, message, and author line the pull request adds, so a value
      # committed and removed again within the branch still fails. CI has no
      # private literals, so this runs the publishable patterns only.
      - name: Scan the pull request for leaks
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Scan source commits rather than GitHub's synthetic merge signature.
        run: mise run devtools:lint-leaks -- --range "${BASE_SHA}..${HEAD_SHA}"

      - name: Test the leak check
        run: bats .devtools/scripts/check-leaks.bats

  test-matrix:
    name: "test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    steps:
      - name: Harden the runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.15

      # The documentation checks and the Go tests with coverage need the full pinned toolchain.
      - name: Check
        run: mise run check

  # The web workspace's gates, one job per mise task, apart from the Go
  # jobs. Each installs only Node, pnpm and Biome, then the workspace from
  # the root lockfile.
  web:
    name: "web (${{ matrix.task }})"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        task:
          - lint-web-all
          - cover-web
          - e2e-web
          - mutate-web
          - audit-web
          - check-web-gates
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.9
          install_args: node pnpm biome

      - name: Locate the pnpm store
        id: pnpm-store
        run: |
          store=$(mise exec -- pnpm store path --silent)
          echo "path=${store}" >> "${GITHUB_OUTPUT}"

      # The key is the workspace's one lockfile at the repository root.
      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install the workspace packages
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "0"
        run: mise run install-web

      # --with-deps also installs the system libraries the browser needs.
      - name: Install the pinned browser
        if: matrix.task == 'e2e-web' || matrix.task == 'check-web-gates'
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "0"
        run: mise run install-web-browsers -- --with-deps

      - name: Run the gate
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "0"
          TASK: ${{ matrix.task }}
        run: mise run "${TASK}"

  # The matrix jobs report as `test (ubuntu-24.04)`, `test (macos-15)` and
  # `web (<task>)`. This job owns the plain name `test`, so the
  # required-check list names one check and stays stable when a matrix
  # changes. `if: always()` keeps it running after a failed slot, and
  # anything but `success` from either matrix -- failure, cancelled, or
  # skipped -- fails it.
  test:
    name: test
    if: always()
    needs: [test-matrix, web]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every matrix leg to pass
        env:
          GO_RESULT: ${{ needs.test-matrix.result }}
          WEB_RESULT: ${{ needs.web.result }}
        run: |
          if [[ "${GO_RESULT}" != "success" ]]; then
            echo "the test matrix finished as ${GO_RESULT}" >&2
            exit 1
          fi
          if [[ "${WEB_RESULT}" != "success" ]]; then
            echo "the web matrix finished as ${WEB_RESULT}" >&2
            exit 1
          fi

  vuln:
    name: vuln
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.15
          install_args: go

      - name: Check reachable Go vulnerabilities
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "0"
        run: mise run vuln

  # The Go coverage floors in .testcoverage.yml were measured on Linux.
  cover-go-check:
    name: cover-go-check
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.15
          install_args: go

      - name: Measure Go coverage
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "0"
        run: mise run cover-go

  # Resyncs the devtools payload in place from vendir.yml and fails on any
  # difference from the committed tree. That catches a vendored file edited
  # in place, a sync nobody committed, and a manifest bump whose
  # vendir.lock.yml is stale. The second step does the same for go.mod,
  # go.sum and vendor/.
  vendor-check:
    name: vendor-check
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.15
          install_args: go vendir

      - name: Check the vendored payload
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "0"
        run: mise run devtools:check-vendored

      - name: Check vendor drift
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "0"
        run: mise run vendor-check
