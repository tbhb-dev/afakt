---
# Quality gates for afakt: lint, Go tests on Linux and macOS, coverage,
# reachable vulnerabilities, and drift in the payload and Go dependencies.
# Every job installs the pinned toolchain through mise and runs its gate
# through `mise run`, so the mise config stays the single definition of what
# each gate runs.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A lockfile only binds a version it has already seen. Without this, moving
# a pin in mise.toml and leaving mise.lock alone makes mise fetch the new
# version, compute a fresh digest, and rewrite the lockfile in place -- so a
# Renovate PR that touched only the manifest would go green while the
# committed digests drifted from the pins under review. MISE_LOCKED makes
# that a hard failure instead.
env:
  MISE_LOCKED: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # Full history: the leak scan below reads every commit a pull
      # request adds, and a shallow clone is refused as incomplete.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up the toolchain
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.15

      # Bootstrap as a fresh clone does: it syncs the payload, fetches the
      # Vale style packages .vale.ini declares, and installs the git hooks.
      # MISE_LOCKED is off here because a clone runs without it, and under
      # it `mise install` never rewrites mise.lock. A lockfile the pinned
      # mise would rewrite then shows up in the next step.
      - name: Bootstrap
        env:
          MISE_LOCKED: "0"
        run: mise run bootstrap

      # Throwaway proof for #71: edit a tracked file after bootstrap so the
      # next check fails and names it.
      - name: Edit a tracked file
        run: echo "AC4 proof" >> README.md

      - name: Check that bootstrap left the tree clean
        run: |
          changes="$(git status --porcelain)"
          if [[ -n "${changes}" ]]; then
            while IFS= read -r line; do
              echo "::error file=${line:3}::bootstrap changed ${line:3}"
            done <<< "${changes}"
            git --no-pager diff
            exit 1
          fi

      - name: Lint
        run: mise run lint

      # The tree scan in `lint` sees only the checkout. This reads every
      # commit, message, and author line the pull request adds, so a value
      # committed and removed again within the branch still fails. CI has no
      # private literals, so this runs the publishable patterns only.
      - name: Scan the pull request for leaks
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Scan source commits rather than GitHub's synthetic merge signature.
        run: mise run devtools:lint-leaks -- --range "${BASE_SHA}..${HEAD_SHA}"

      - name: Test the leak check
        run: bats .devtools/scripts/check-leaks.bats

  test-matrix:
    name: "test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    steps:
      - name: Harden the runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.15

      # The documentation checks and the Go tests with coverage need the full pinned toolchain.
      - name: Check
        run: mise run check

  # The matrix job reports as `test (ubuntu-24.04)` and `test (macos-15)`.
  # This job owns the plain name `test`, so the required-check list names
  # one check and stays stable when the matrix changes. `if: always()` keeps
  # it running after a failed slot, and anything but `success` -- failure,
  # cancelled, or skipped -- fails it.
  test:
    name: test
    if: always()
    needs: test-matrix
    runs-on: ubuntu-24.04
    steps:
      - name: Require every matrix leg to pass
        env:
          RESULT: ${{ needs.test-matrix.result }}
        run: |
          if [[ "${RESULT}" != "success" ]]; then
            echo "the test matrix finished as ${RESULT}" >&2
            exit 1
          fi

  vuln:
    name: vuln
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.15
          install_args: go

      - name: Check reachable Go vulnerabilities
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "0"
        run: mise run vuln

  # The Go coverage floors in .testcoverage.yml were measured on Linux.
  cover-go-check:
    name: cover-go-check
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.15
          install_args: go

      - name: Measure Go coverage
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "0"
        run: mise run cover-go

  # Resyncs the devtools payload in place from vendir.yml and fails on any
  # difference from the committed tree. That catches a vendored file edited
  # in place, a sync nobody committed, and a manifest bump whose
  # vendir.lock.yml is stale. The second step does the same for go.mod,
  # go.sum and vendor/.
  vendor-check:
    name: vendor-check
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.15
          install_args: go vendir

      - name: Check the vendored payload
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "0"
        run: mise run devtools:check-vendored

      - name: Check vendor drift
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "0"
        run: mise run vendor-check
