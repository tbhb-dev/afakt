---
# PR gate for the Renovate config: strict validation plus a check that the
# pinned preset references resolve.
name: Validate Renovate configuration

on:
  pull_request:
    paths:
      - ".github/renovate.json5"
      - ".github/workflows/renovate-config-validator.yaml"

permissions:
  contents: read

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: tbhb-dev/renovate-config/.github/workflows/renovate-config-validator.yaml@d37a5c70b41eda7cb0bd1b233839251f6b315068  # main
    with:
      configs: .github/renovate.json5
