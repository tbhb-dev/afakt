# cargo-deny policy for `mise run deny`; `mise run vuln` runs the advisories check alone.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Check direct dependencies for unmaintained crates.
unmaintained = "workspace"
unsound = "all"

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
