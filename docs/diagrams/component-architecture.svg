<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="990" height="610" viewBox="0 0 990 610" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <title>afakt component architecture</title>
  <desc>The afakt binary contains the web dashboard, the command-line interface, the API server, the GitHub webhook receiver, and the workflows, including Agent runner. A browser reaches the web dashboard. GitHub sends deliveries to the webhook receiver, which calls the API server. The web dashboard, the command-line interface, and the workflows call the API server over REST. The API server, the webhook receiver, and the workflows themselves start workflows on the workflow orchestrator. The API server and the workflows call the GitHub API. Temporal, the workflow orchestrator, runs the workflows on workers inside the binary. Agent runner runs coding agents.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- afakt binary boundary -->
  <rect x="40" y="120" width="680" height="470" rx="12" fill="none" stroke="#57606a" stroke-width="2"/>
  <text x="60" y="148" font-size="16" font-weight="600" fill="#57606a">afakt binary</text>

  <!-- external parties -->
  <g stroke="#57606a" stroke-width="1.5" stroke-dasharray="6 4" fill="#f6f8fa">
    <rect x="60" y="20" width="180" height="60" rx="8"/>
    <rect x="500" y="20" width="180" height="60" rx="8"/>
    <rect x="780" y="390" width="190" height="60" rx="8"/>
    <rect x="780" y="470" width="190" height="60" rx="8"/>
  </g>
  <g fill="#1f2328" text-anchor="middle">
    <text x="150" y="55">Browser</text>
    <text x="590" y="55">GitHub</text>
    <text x="875" y="415">Workflow orchestrator</text>
    <text x="875" y="435" font-size="13" fill="#57606a">Temporal</text>
    <text x="875" y="505">Coding agents</text>
  </g>

  <!-- components inside the binary -->
  <g stroke="#57606a" stroke-width="1.5" fill="#f6f8fa">
    <rect x="60" y="170" width="180" height="60" rx="8"/>
    <rect x="60" y="270" width="180" height="60" rx="8"/>
    <rect x="320" y="170" width="160" height="160" rx="8"/>
    <rect x="500" y="170" width="200" height="60" rx="8"/>
    <rect x="320" y="400" width="340" height="170" rx="8" fill="#ffffff"/>
    <rect x="340" y="470" width="180" height="60" rx="8"/>
  </g>
  <g fill="#1f2328" text-anchor="middle">
    <text x="150" y="205">Web dashboard</text>
    <text x="150" y="305">Command-line interface</text>
    <text x="400" y="255">API server</text>
    <text x="600" y="205">GitHub webhook receiver</text>
    <text x="490" y="430" font-weight="600">Workflows</text>
    <text x="430" y="505">Agent runner</text>
  </g>

  <!-- edges -->
  <g stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="150" y1="80" x2="150" y2="168"/>
    <line x1="240" y1="200" x2="318" y2="200"/>
    <line x1="240" y1="300" x2="318" y2="300"/>
    <line x1="590" y1="80" x2="590" y2="168"/>
    <line x1="500" y1="215" x2="482" y2="215"/>
    <polyline points="480,290 560,290 560,360 830,360 830,388"/>
    <line x1="400" y1="400" x2="400" y2="332"/>
    <line x1="780" y1="420" x2="662" y2="420"/>
    <line x1="520" y1="500" x2="778" y2="500"/>
    <polyline points="400,170 400,50 498,50"/>
    <path d="M 640 400 L 640 380 L 740 380 L 740 366 A 6 6 0 0 0 740 354 L 740 50 L 682 50"/>
  </g>
  <g stroke="#57606a" stroke-width="1.5">
    <line x1="600" y1="230" x2="600" y2="360"/>
    <line x1="560" y1="400" x2="560" y2="360"/>
  </g>
  <g fill="#57606a" font-size="13">
    <text x="158" y="130">web UI</text>
    <text x="262" y="192">REST</text>
    <text x="262" y="292">REST</text>
    <text x="598" y="130">webhook deliveries</text>
    <text x="486" y="238" text-anchor="middle">REST</text>
    <text x="640" y="352">starts workflows</text>
    <text x="408" y="372">REST</text>
    <text x="668" y="412">runs on workers</text>
    <text x="600" y="492">runs</text>
    <text x="408" y="42">GitHub API</text>
    <text x="686" y="42">GitHub API</text>
  </g>
</svg>
