<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="990" height="710" viewBox="0 0 990 710" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <title>afakt component architecture</title>
  <desc>The afakt binary contains the command-line interface, the API server, the GitHub webhook receiver, and the workflows, including Agent runner. The web dashboard runs outside the binary as a platform app on afakt's Platform as a Service. A browser reaches the web dashboard. GitHub sends deliveries to the webhook receiver, which calls the API server. The web dashboard, the command-line interface, and the workflows call the API server over REST. The API server, the webhook receiver, and the workflows themselves start workflows on the workflow orchestrator. The API server and the workflows call the GitHub API. Temporal, the workflow orchestrator, runs the workflows on workers inside the binary. Agent runner runs coding agents.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- afakt binary boundary -->
  <rect x="40" y="220" width="680" height="470" rx="12" fill="none" stroke="#57606a" stroke-width="2"/>
  <text x="60" y="248" font-size="16" font-weight="600" fill="#57606a">afakt binary</text>

  <!-- external parties -->
  <g stroke="#57606a" stroke-width="1.5" stroke-dasharray="6 4" fill="#f6f8fa">
    <rect x="60" y="20" width="180" height="60" rx="8"/>
    <rect x="60" y="120" width="180" height="60" rx="8"/>
    <rect x="500" y="20" width="180" height="60" rx="8"/>
    <rect x="780" y="490" width="190" height="60" rx="8"/>
    <rect x="780" y="570" width="190" height="60" rx="8"/>
  </g>
  <g fill="#1f2328" text-anchor="middle">
    <text x="150" y="55">Browser</text>
    <text x="150" y="150">Web dashboard</text>
    <text x="150" y="168" font-size="13" fill="#57606a">PaaS app</text>
    <text x="590" y="55">GitHub</text>
    <text x="875" y="515">Workflow orchestrator</text>
    <text x="875" y="535" font-size="13" fill="#57606a">Temporal</text>
    <text x="875" y="605">Coding agents</text>
  </g>

  <!-- components inside the binary -->
  <g stroke="#57606a" stroke-width="1.5" fill="#f6f8fa">
    <rect x="60" y="370" width="180" height="60" rx="8"/>
    <rect x="320" y="270" width="160" height="160" rx="8"/>
    <rect x="500" y="270" width="200" height="60" rx="8"/>
    <rect x="320" y="500" width="340" height="170" rx="8" fill="#ffffff"/>
    <rect x="340" y="570" width="180" height="60" rx="8"/>
  </g>
  <g fill="#1f2328" text-anchor="middle">
    <text x="150" y="405">Command-line interface</text>
    <text x="400" y="355">API server</text>
    <text x="600" y="305">GitHub webhook receiver</text>
    <text x="490" y="530" font-weight="600">Workflows</text>
    <text x="430" y="605">Agent runner</text>
  </g>

  <!-- edges -->
  <g stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="150" y1="80" x2="150" y2="118"/>
    <polyline points="240,150 360,150 360,268"/>
    <line x1="240" y1="400" x2="318" y2="400"/>
    <line x1="590" y1="80" x2="590" y2="268"/>
    <line x1="500" y1="315" x2="482" y2="315"/>
    <polyline points="480,390 560,390 560,460 830,460 830,488"/>
    <line x1="400" y1="500" x2="400" y2="432"/>
    <line x1="780" y1="520" x2="662" y2="520"/>
    <line x1="520" y1="600" x2="778" y2="600"/>
    <polyline points="400,270 400,50 498,50"/>
    <path d="M 640 500 L 640 480 L 740 480 L 740 466 A 6 6 0 0 0 740 454 L 740 50 L 682 50"/>
  </g>
  <g stroke="#57606a" stroke-width="1.5">
    <line x1="600" y1="330" x2="600" y2="460"/>
    <line x1="560" y1="500" x2="560" y2="460"/>
  </g>
  <g fill="#57606a" font-size="13">
    <text x="158" y="104">web UI</text>
    <text x="262" y="142">REST</text>
    <text x="262" y="392">REST</text>
    <text x="598" y="130">webhook deliveries</text>
    <text x="486" y="338" text-anchor="middle">REST</text>
    <text x="640" y="452">starts workflows</text>
    <text x="408" y="472">REST</text>
    <text x="668" y="512">runs on workers</text>
    <text x="600" y="592">runs</text>
    <text x="408" y="42">GitHub API</text>
    <text x="686" y="42">GitHub API</text>
  </g>
</svg>
