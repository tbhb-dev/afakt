# afakt toolchain and tasks.

[settings]
lockfile = true
idiomatic_version_file_enable_tools = []

[tools]
vendir = "0.46.3"
apm = "0.34.0"
shfmt = "3.14.1"
jq = "1.8.2"
"go:github.com/tbhb-dev/devtools/cmd/guard-markdown" = "v0.21.0"
"go:github.com/tbhb-dev/devtools/cmd/commit-lint" = "v0.21.0"
"go:github.com/tbhb-dev/devtools/cmd/agentrepo" = "v0.21.0"
"go:github.com/tbhb-dev/devtools/cmd/gh-post" = "v0.21.0"
bats = "1.14.0"
ast-grep = "0.51.0"
vacuum = "0.33.2"
# The web project's runtime and package manager. The devtools payload pins
# the same Node release for cspell; this pin is the one Renovate tracks, and
# it must stay equal to the payload's.
node = "24.21.0"
pnpm = "12.14.0"
# Java archives keep the diagram tools portable across Linux and macOS.
# Neither project has an aqua entry; Structurizr publishes its WAR separately.
java = "temurin-21.0.13+9.0.LTS"
"github:plantuml/plantuml" = { version = "1.2026.9", asset_pattern = "plantuml-1.2026.9.jar", format = "raw", bin = "plantuml.jar" }
"http:structurizr" = { version = "2026.09.19", url = "https://download.structurizr.com/structurizr-{{ version }}.war", checksum = "sha256:ac1a2806e246364b88261a542a36ca7f3006ef48e5de68830afa8672f58690f1", format = "raw", bin = "structurizr.war" }

[env]
_.path = ["{{config_root}}/scripts/architecture-bin"]
DEVTOOLS_LOCK_PLATFORMS = "linux-x64,macos-arm64"
DEVTOOLS_GO_MODULES_MODE = "vendor"
DEVTOOLS_GENERATED_PATHS = ".devtools/\n.config/mise/\nbin/\ncoverage/\ntmp/\nspikes/\n.vale/"
DEVTOOLS_PROSE_GLOB = "{**/*.md,*.go,api/openapi/**/*.yaml}"
# The Chrome Headless Shell build that @playwright/test 1.64.0 installs. The
# e2e-web task fails when the browser it runs reports a different version.
AFAKT_WEB_CHROMIUM = "156.0.8078.4"

[task_config]
includes = [
  ".devtools/tasks/apm.toml",
  ".devtools/tasks/fix.toml",
  ".devtools/tasks/format.toml",
  ".devtools/tasks/git-hooks.toml",
  ".devtools/tasks/go.toml",
  ".devtools/tasks/leaks.toml",
  ".devtools/tasks/lint.toml",
  ".devtools/tasks/pins.toml",
  ".devtools/tasks/preapproval.toml",
  ".devtools/tasks/security.toml",
  ".devtools/tasks/toolchain.toml",
  ".devtools/tasks/vendir.toml",
]

[tasks.bootstrap]
description = "Sync the vendored payload, install the toolchain, and install git hooks"
alias = "setup"
run = [
  "vendir sync",
  "mise run install-toolchain",
  "mise run install-tools",
  "mise run devtools:prek-install",
  "mise run devtools:install-leak-hook",
]

[tasks.install-toolchain]
description = "Install the pinned toolchain from mise.toml and the vendored conf.d"
run = "mise install"

[tasks.install-tools]
description = "Download the Vale style packages .vale.ini names"
run = "vale sync"

[tasks.check-docs]
shell = "bash -c"
description = "guard-markdown on every tracked Markdown file, then the OKF check on docs/ and on every other Markdown file"
run = """
command -v guard-markdown >/dev/null || { echo "guard-markdown not found; install it with: mise run install-toolchain" >&2; exit 1; }
git ls-files -z '*.md' ':!:.devtools/**' ':!:.claude/**' ':!:apm_modules/**' ':!:vendor/**' | while IFS= read -r -d '' f; do [ -e "$f" ] && printf '%s\\0' "$f"; done | xargs -0 guard-markdown
uv run --no-project --with pyyaml python scripts/okf-check.py docs
uv run --no-project --with pyyaml python scripts/okf-check.py --repo .
"""

[tasks.check]
description = "Check documentation and Go tests with coverage"
run = [
  { task = "check-docs" },
  { task = "test-go" },
  { task = "test-go-race" },
  { task = "cover-go" },
]

[tasks.lint-draft]
extends = "devtools:lint-draft"

[tasks.lint-pr-description]
extends = "devtools:lint-pr-description"
run = [
  "bash .claude/skills/pr/scripts/validate-description.sh",
  "vale --output=ai-tells-agent.tmpl PR_AGENTDESC.md",
  "cspell --config .cspell.jsonc --no-summary --no-progress --no-gitignore PR_AGENTDESC.md",
  "bash $DEVTOOLS_DIR/scripts/check-leaks.sh PR_AGENTDESC.md",
]

[tasks.lint-prose]
extends = "devtools:lint-prose"

[tasks.check-prose-gate]
description = "Prove prose lint rejects generated findings in root and nested Markdown"
run = "bash scripts/check-prose-gate.sh"

[tasks.fix-prose-replacements]
extends = "devtools:fix-prose-replacements"

[tasks.lint-commit-msg]
extends = "devtools:lint-commit-msg"

[tasks.lint-squash-msg]
extends = "devtools:lint-squash-msg"

[tasks.lint-skills]
shell = "bash -c"
description = "Lint .claude/rules, which devtools' file selection skips as an APM-deployed file"
run = """
set -euo pipefail
shopt -s nullglob
docs=(.claude/rules/*.md)
vale --output=ai-tells-agent.tmpl "${docs[@]}"
guard-markdown "${docs[@]}"
"""

[tasks.lint]
extends = "devtools:lint"
run = [
  "mise run devtools:check-vendored",
  "mise run devtools:check-pins",
  "mise run devtools:check-toolchain",
  "mise run devtools:lint-apm",
  "mise run devtools:lint-leaks",
  "mise run devtools:check-leak-hook",
  "mise run lint-prose",
  "mise run devtools:lint-spelling",
  "mise run devtools:lint-markdown",
  "mise run devtools:lint-markdown-wrap",
  "mise run devtools:lint-config",
  "mise run devtools:lint-yaml",
  "mise run devtools:lint-toml",
  "mise run devtools:lint-mise",
  "mise run devtools:lint-workflows",
  "mise run devtools:lint-shell",
  "mise run devtools:lint-shell-fmt",
  "mise run test-gomodscan",
  "mise run gomodscan",
  "bash scripts/owner-paths-check.sh",
  "mise run lint-skills",
  "mise run devtools:lint-curl",
  "mise run lint-go-all",
  "mise run lint-go-fmt",
  "mise run lint-ast-grep",
  "mise run lint-openapi",
  "mise run check-openapi-bundle",
  "mise run validate-workspace",
  "mise run lint-workspace",
  "mise run check-workspace",
  "mise run check-diagrams",
]

# WORKSPACE_ROOT allows checks against temporary copies of docs/.
[tasks.validate-workspace]
description = "Validate the Structurizr workspace"
run = 'structurizr validate -workspace "${WORKSPACE_ROOT:-docs}/workspace.dsl"'

[tasks.lint-workspace]
description = "Fail on workspace inspection violations"
# Only the documentation and decisions rules have ignore severity in the DSL.
run = 'structurizr inspect -workspace "${WORKSPACE_ROOT:-docs}/workspace.dsl" -severity error,warning,info'

[tasks.generate-workspace]
description = "Generate workspace JSON from the DSL"
shell = "bash -c"
run = '''
set -euo pipefail
root=${WORKSPACE_ROOT:-docs}
dir=$(mktemp -d)
trap 'rm -rf "$dir"' EXIT
structurizr export -workspace "$root/workspace.dsl" -format json -output "$dir"
biome format --stdin-file-path docs/workspace.json <"$dir/workspace.json" >"${WORKSPACE_JSON:-$root/workspace.json}"
'''

[tasks.check-workspace]
description = "Check workspace JSON freshness"
shell = "bash -c"
run = '''
set -euo pipefail
root=${WORKSPACE_ROOT:-docs}
dir=$(mktemp -d)
trap 'rm -rf "$dir"' EXIT
WORKSPACE_JSON=$dir/workspace.json mise run generate-workspace
if ! diff -u "$root/workspace.json" "$dir/workspace.json"; then
  echo "error: workspace JSON is out of date; run 'mise run generate-workspace' and commit the result" >&2
  exit 1
fi
'''

[tasks.export-diagrams]
description = "Render workspace views as PNG and SVG with PlantUML"
run = "bash scripts/workspace-diagrams.sh export"

[tasks.check-diagrams]
description = "Check diagram sources and rendering hashes"
run = "bash scripts/workspace-diagrams.sh check"

# The REST contract is the multi-file OpenAPI document under api/openapi/, and
# api/openapi.bundle.yaml is its committed single-file bundle. OPENAPI_ROOT points
# these tasks at another copy of api/, such as a broken copy in a temporary directory.
[tasks.bundle-openapi]
shell = "bash -c"
description = "Bundle the OpenAPI document under api/openapi/ into api/openapi.bundle.yaml"
run = '''
set -euo pipefail
root=${OPENAPI_ROOT:-api}
out=${OPENAPI_BUNDLE:-$root/openapi.bundle.yaml}
tmp=$(mktemp)
trap 'rm -f "$tmp"' EXIT
if ! {
  echo "---"
  echo "# Generated from openapi/ by 'mise run bundle-openapi'. Do not edit."
  vacuum bundle --no-update-check --no-style --composed --stdout --base "$root/openapi" "$root/openapi/openapi.yaml"
} >"$tmp"; then
  # vacuum writes its reference errors to stdout, which went to the temporary file.
  cat "$tmp" >&2
  echo "error: vacuum could not bundle $root/openapi/openapi.yaml; fix the references it reports" >&2
  exit 1
fi
cat "$tmp" >"$out"
'''

[tasks.check-openapi-bundle]
shell = "bash -c"
description = "Fail when api/openapi.bundle.yaml can't be produced or differs from a fresh bundle"
run = '''
set -euo pipefail
root=${OPENAPI_ROOT:-api}
dir=$(mktemp -d)
trap 'rm -rf "$dir"' EXIT
OPENAPI_BUNDLE=$dir/openapi.bundle.yaml mise run bundle-openapi
if ! diff -u "$root/openapi.bundle.yaml" "$dir/openapi.bundle.yaml"; then
  echo "error: $root/openapi.bundle.yaml is out of date with $root/openapi/; run 'mise run bundle-openapi' and commit the result" >&2
  exit 1
fi
'''

[tasks.lint-openapi]
shell = "bash -c"
description = "Lint the OpenAPI source and bundle with vacuum and .vacuum-ruleset.yaml"
run = '''
set -euo pipefail
root=${OPENAPI_ROOT:-api}
for doc in "$root/openapi/openapi.yaml" "$root/openapi.bundle.yaml"; do
  vacuum lint --no-update-check --no-banner --no-style --details --no-clip --fail-severity hint \
    --ruleset .vacuum-ruleset.yaml "$doc"
done
'''

[tasks.build]
description = "Build the web project, then embed it in bin/afakt; remove any old binary first"
run = "bash scripts/build.sh"

[tasks.check-dashboard]
description = "Build the release, test its embedded assets and server contracts, then run the pinned browser"
run = [
  "mise run build",
  "go test -tags dashboard_production ./...",
  "bash scripts/check-dashboard-binary.sh",
  "mise run e2e-dashboard",
  "mise run e2e-temporal-ui",
]

[tasks.e2e-dashboard]
description = "Check the release binary in the pinned browser with console and accessibility assertions"
dir = "{{config_root}}/apps/dashboard"
run = "pnpm exec playwright test --config binary/playwright.config.ts"

[tasks.e2e-temporal-ui]
description = "Check the embedded Temporal UI and workflow list in the pinned browser"
dir = "{{config_root}}/apps/dashboard"
run = "pnpm exec playwright test --config temporal/playwright.config.ts"

[tasks.check-all-targets]
description = "Build the release and check every target together without external services"
run = ["mise run build", "bash scripts/check-all-targets.sh"]

[tasks.e2e-all-targets]
description = "Check the running all-targets binary in the pinned browser"
dir = "{{config_root}}/apps/dashboard"
run = "pnpm exec playwright test --config all/playwright.config.ts"

[tasks.check-dashboard-gates]
description = "Prove release and browser failures and the required CI result on generated broken inputs"
run = "bash scripts/check-dashboard-gates.sh"

[tasks.check-dashboard-all]
description = "Install web dependencies and the browser, then run dashboard checks and failure proofs in sequence"
env = { GOMAXPROCS = "2", GOFLAGS = "-p=2" }
run = [
  "mise run install-web",
  "mise run install-web-browsers",
  "mise run check-dashboard",
  "mise run check-dashboard-gates",
]

[tasks.check-go-only]
description = "Run every Go-only gate without generated assets or web tools"
run = [
  "bash scripts/check-go-only.sh",
  "mise run test-go",
  "mise run test-go-race",
  "mise run cover-go",
  "mise run lint-go-deadcode",
  "mise run vendor-check",
]

# The operator skills commit and pr hardcode `mise run test`, so the task stays as a wrapper.
[tasks.test]
description = "Run devtools:test-go"
run = "mise run devtools:test-go"

[tasks.test-go]
description = "Run devtools:test-go"
run = "mise run devtools:test-go"

[tasks.test-go-race]
description = "Run devtools:test-go-race"
run = "mise run devtools:test-go-race"

[tasks.lint-go-all]
description = "Run devtools:lint-go-all"
run = "mise run devtools:lint-go-all"

[tasks.lint-go-arch]
description = "Run devtools:lint-go-arch"
run = "mise run devtools:lint-go-arch"

[tasks.lint-go-deadcode]
description = "Run devtools:lint-go-deadcode"
run = "mise run devtools:lint-go-deadcode"

[tasks.cover-go]
description = "Run devtools:cover-go"
run = "mise run devtools:cover-go"

[tasks.cover-go-check]
description = "Run devtools:cover-go-check"
run = "mise run devtools:cover-go-check"

[tasks.vuln]
description = "Run devtools:vuln"
run = "mise run devtools:vuln"

[tasks.mutate-go]
description = "Run devtools:mutate-go"
run = "mise run devtools:mutate-go"

[tasks.vendor]
description = "Run devtools:vendor"
run = "mise run devtools:vendor"

# Interim exact-match waivers; remove when tbhb-dev/devtools#732 ships.
[tasks.gomodscan]
description = "Scan modules with exact accepted findings and reject stale entries"
run = "bash scripts/gomodscan.sh text"

[tasks.gomodscan-sarif]
description = "Scan modules with exact accepted findings and retain SARIF output"
usage = 'arg "<file>"'
run = 'bash scripts/gomodscan.sh sarif "$usage_file"'

[tasks.test-gomodscan]
description = "Test the module scanner wrapper in temporary repositories"
run = "bats scripts/gomodscan.bats"

# Local workaround for tbhb-dev/devtools#289: detect untracked vendor files.
# Capture them before regeneration too, since go mod vendor removes stray files.
# Remove this task and point at devtools:vendor-check once that issue closes and that task does the same.
[tasks.vendor-check]
description = "Check that vendor/, go.mod, and go.sum are in sync"
run = '''
#!/usr/bin/env bash
set -euo pipefail
untracked_before=$(git ls-files --others --exclude-per-directory=.gitignore -- go.mod go.sum vendor/)
go mod tidy
go mod vendor
untracked_after=$(git ls-files --others --exclude-per-directory=.gitignore -- go.mod go.sum vendor/)
if [[ -n $untracked_before || -n $untracked_after ]] || ! git diff --exit-code -- go.mod go.sum vendor/; then
  printf '%s\n' "$untracked_before" "$untracked_after" | sort -u >&2
  echo "vendor drift detected; run 'mise run vendor' and commit" >&2
  exit 1
fi
'''

# Local workaround for tbhb-dev/devtools#283: the payload has no Go format check, only the
# in-place devtools:format-go. Remove this task once devtools ships a check-only formatter task.
[tasks.lint-go-fmt]
description = "Check Go formatting"
run = "golangci-lint fmt --diff ./cmd/... ./internal/..."

# Local workaround for tbhb-dev/devtools#551: the payload's devtools:gitleaks walks every local ref,
# so one worktree's local commit fails the scan in every other worktree. This copy of the payload
# task adds only --log-opts=HEAD, which limits the walk to the history reachable from HEAD.
# Remove it once that issue closes and the payload task scopes the walk itself.
[tasks."devtools:gitleaks"]
description = "Scan the Git history reachable from HEAD for committed secrets"
run = '''
#!/usr/bin/env bash
set -eu
log=$(mktemp)
trap 'rm -f "$log"' EXIT

status=0
gitleaks git --verbose --redact --log-opts=HEAD . >"$log" 2>&1 || status=$?
cat "$log"

if ! grep -qE '[1-9][0-9]* commits scanned' "$log"; then
    if git rev-parse --verify HEAD >/dev/null 2>&1 &&
        git log -p --format= HEAD >"$log" &&
        ! grep -qE '^[+-]' "$log"; then
        echo "Git history has no content to scan."
        exit "$status"
    fi
    echo "gitleaks walked 0 commits, so this scan proves nothing." >&2
    # shellcheck disable=SC2312 # pwd only supplies context for an already failed scan
    echo "Check that the repository resolves from $(pwd)." >&2
    exit 1
fi
exit "$status"
'''

# Local task until devtools ships an ast-grep gate. The rules live in .ast-grep/rules, each
# naming its own language, so the scan covers the whole tree except vendored and generated paths.
[tasks.lint-ast-grep]
description = "Run the ast-grep rules in .ast-grep/rules against the repository"
run = """
ast-grep scan --config sgconfig.yml \
  --globs '!vendor/**' --globs '!apm_modules/**' --globs '!.devtools/**' --globs '!.config/mise/**' \
  --globs '!bin/**' --globs '!coverage/**' --globs '!tmp/**' --globs '!spikes/**' --globs '!.vale/**' .
"""

# Web workspace. The pnpm workspace rooted here holds the shared tool
# configuration; apps/dashboard holds the dashboard package.
[tasks.install-web]
description = "Install the pnpm workspace's packages from the root lockfile"
run = "pnpm install --frozen-lockfile"

[tasks.install-web-browsers]
description = "Install the Chrome Headless Shell build that the pinned Playwright release runs"
dir = "{{config_root}}/apps/dashboard"
run = "pnpm exec playwright install chromium --only-shell"

[tasks.dev-web]
description = "Serve the dashboard from the Vite development server"
dir = "{{config_root}}/apps/dashboard"
run = "pnpm exec vite"

[tasks.build-web]
description = "Build the dashboard's static assets into apps/dashboard/dist"
dir = "{{config_root}}/apps/dashboard"
run = "pnpm exec vite build"

[tasks.test-web]
description = "Run the dashboard's unit tests"
dir = "{{config_root}}/apps/dashboard"
run = "pnpm exec vitest run"

[tasks.cover-web]
description = "Run the dashboard's unit tests and enforce 100% coverage per file and in total"
dir = "{{config_root}}/apps/dashboard"
run = "pnpm exec vitest run --coverage"

[tasks.e2e-web]
description = "Load the built and development dashboard in the pinned browser and scan it for accessibility violations"
depends = ["build-web"]
dir = "{{config_root}}/apps/dashboard"
run = "pnpm exec playwright test"

[tasks.mutate-web]
description = "Run StrykerJS mutation testing on the dashboard and fail below a 100% score"
dir = "{{config_root}}/apps/dashboard"
run = "pnpm exec stryker run ../../stryker.config.json"

[tasks.lint-web-biome]
description = "Check the workspace with Biome, every rule group at error for TypeScript"
run = "biome ci ."

[tasks.lint-web-types]
description = "Type-check the workspace root and the dashboard under the strict base tsconfig"
run = [
  "pnpm exec tsc -p tsconfig.json",
  "pnpm exec tsc -p apps/dashboard/tsconfig.json",
  "pnpm exec tsc -p apps/dashboard/tsconfig.node.json",
]

[tasks.lint-web-eslint]
description = "Run the typescript-eslint type-aware rules that Biome lacks"
run = [
  "pnpm exec eslint --max-warnings 0 '*.ts'",
  "cd apps/dashboard && pnpm exec eslint --max-warnings 0 .",
]

[tasks.lint-web-dup]
description = "Fail on any duplicated TypeScript block with jscpd"
run = "pnpm exec jscpd --config .jscpd.json"

[tasks.lint-web-deadcode]
description = "Fail on unused files, exports, and dependencies with knip"
run = "pnpm exec knip"

[tasks.lint-web-all]
description = "Run every web lint gate"
depends = [
  "lint-web-biome",
  "lint-web-types",
  "lint-web-eslint",
  "lint-web-dup",
  "lint-web-deadcode",
]

[tasks.audit-web]
description = "Fail on a high or critical advisory against any locked web dependency, or on an incomplete audit"
run = "pnpm audit --audit-level high"

[tasks.check-web-install]
description = "Install web packages in a temporary clone and require a clean working tree"
run = "bash scripts/check-web-install.sh"

# `mise run check-web-gate <gate>` writes broken input for one gate into a
# temporary copy of the workspace, runs the gate there, and fails unless the
# gate fails with the expected findings. scripts/check-web-gate.sh lists the gates.
[tasks.check-web-gate]
description = "Show that one web gate fails on generated broken input outside the source tree"
run = "bash scripts/check-web-gate.sh"

[tasks.check-web-gates]
description = "Show that every web gate fails on generated broken input"
shell = "bash -c"
run = """
set -euo pipefail
for gate in biome types eslint cover property dup deadcode audit mutate e2e-console e2e-axe e2e-browser; do
  bash scripts/check-web-gate.sh "$gate"
done
"""

# One gate at a time: mutate-web mutates the sources in place, so a gate
# running beside it would read mutated files and Stryker's setup files.
[tasks.check-web]
description = "Run every web gate"
run = [
  { task = "lint-web-all" },
  { task = "cover-web" },
  { task = "e2e-web" },
  { task = "mutate-web" },
  { task = "audit-web" },
  { task = "check-web-install" },
  { task = "check-web-gates" },
]
